<title>RAQAM – Har Hisab, Raqam Ke Saath.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f4;--card:#fff;--ink:#0f2a20;--mut:#6b7c73;--bd:#e2e9e4;--side:#0f2a20;--sideh:#1d4435;--mint:#2fcf8e;--pri:#0f2a20;--ok:#1f7a4d;--okbg:#e4f4ea;--wn:#a8650b;--wnbg:#fdf1dc;--ex:#f3ece1;--ch:#9bb0a5;--inbg:#f0f4f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--card:#12241d;--ink:#e6f1ea;--mut:#8ea397;--bd:#21372d;--side:#08120e;--pri:#2fcf8e;--okbg:#17382b;--ok:#5fe0ac;--wnbg:#3a2c10;--wn:#f0b45a;--ex:#2c2a20;--inbg:#173026;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1713;--card:#12241d;--ink:#e6f1ea;--mut:#8ea397;--bd:#21372d;--side:#08120e;--pri:#2fcf8e;--okbg:#17382b;--ok:#5fe0ac;--wnbg:#3a2c10;--wn:#f0b45a;--ex:#2c2a20;--inbg:#173026;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
body.ur{font-family:'Noto Naskh Arabic',Inter,serif;font-size:15px;line-height:1.8}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{--sw:260px;display:grid;grid-template-columns:var(--sw) 1fr;min-height:100vh}
.app.coll{--sw:76px}
.side{background:var(--side);color:#c9dfd3;position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px;color:#fff;font-weight:700;font-size:21px;letter-spacing:2px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--mint);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:6px;flex:none}
.mark b{width:3px;background:#0f2a20;border-radius:1px;display:block}
.tagl{font-size:11px;color:#8fb0a0;margin:6px 6px 14px}
.biz{display:flex;align-items:center;gap:10px;border:1px solid #274a3a;background:#14352a;border-radius:12px;padding:12px;margin-bottom:14px;color:#fff}
.biz small{display:block;color:#8fb0a0;font-size:11px}
.sec{font-size:11px;letter-spacing:1.5px;color:#7ea592;margin:8px 8px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:none;width:100%;text-align:start;padding:11px 12px;border-radius:10px;color:#c9dfd3;position:relative}
.nv:hover{background:#17382b}
.nv.on{background:var(--sideh);color:#fff;font-weight:600}
.nv.on:before{content:"";position:absolute;inset-inline-start:-14px;top:12px;width:3px;height:16px;background:var(--mint);border-radius:2px}
.nv .bd{margin-inline-start:auto;background:#2b4d3f;border-radius:6px;padding:0 7px;font-size:12px}
.help{margin-top:auto;background:#14352a;border-radius:12px;padding:14px;color:#fff;font-size:13px}
.help small{display:block;color:#8fb0a0}
.help a{color:var(--mint);text-decoration:none;font-weight:600;display:flex;gap:6px;align-items:center;margin-top:8px}
.coll .lbl,.coll .tagl,.coll .biz>div,.coll .sec,.coll .help,.coll .bd{display:none}
.coll .biz{justify-content:center;padding:10px}
.coll .nv{justify-content:center}
.coll .logo{justify-content:center}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;height:66px;padding:0 24px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:5}
.ib{border:0;background:none;color:var(--mut);padding:6px;display:grid;place-items:center;border-radius:8px;position:relative}
.crumb{color:var(--mut);white-space:nowrap}.crumb b{color:var(--ink);font-weight:500}
.search{flex:1;max-width:340px;margin-inline:auto;display:flex;align-items:center;gap:8px;background:var(--inbg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;color:var(--mut)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink);font:inherit}
.dot{position:absolute;top:4px;inset-inline-end:5px;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.me{display:flex;gap:10px;align-items:center;border-inline-start:1px solid var(--bd);padding-inline-start:14px;color:var(--ink)}
.me small{display:block;color:var(--mut);font-size:11px}
.content{padding:28px 28px 40px;max-width:1260px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:28px;letter-spacing:-.3px}
.sub{color:var(--mut);margin:6px 0 0}
.acts{display:flex;gap:10px}
.btn{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:500;color:var(--ink);text-decoration:none}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme="dark"] .btn.p,:root:not([data-theme="light"]) .btn.p{color:#08120e}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.p{color:#fff}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;min-width:0}
.kpi .t{display:flex;justify-content:space-between;color:var(--mut)}
.kpi .v{margin:14px 0 16px;font-size:34px;font-weight:600;letter-spacing:-.5px}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:400;margin-inline-end:6px}
.kpi.dk{background:#0f2a20;color:#fff;border-color:#0f2a20}
.kpi.dk .t,.kpi.dk .v small{color:#9fc4b2}.kpi.dk .t svg{color:var(--mint)}
.pill{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.dk .pill{background:#1d4435;color:#7fe0b4}
.pill.w{background:var(--wnbg);color:var(--wn)}
.kpi .n{color:var(--mut);font-size:11px;margin-inline-start:6px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
h3{margin:0;font-size:17px}
.sm{color:var(--mut);font-size:13px;margin:4px 0 14px}
.rowb{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
select,.sel{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit}
.lg{display:flex;gap:16px;color:var(--mut);font-size:12px;margin-bottom:6px}
.lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px}
svg.ch{width:100%;height:auto;display:block}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:34px;font-weight:600;line-height:1}
.ring small{font-size:11px;color:var(--mut);font-weight:400;margin-top:4px}
.hl{display:flex;gap:18px;align-items:center;margin:8px 0 16px}
.sp{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--bd)}
.lnk{border:0;background:none;display:flex;justify-content:space-between;width:100%;align-items:center;padding:0;font-weight:500;text-align:start}
table{width:100%;border-collapse:collapse}
th{background:var(--inbg);color:var(--mut);font-size:11px;letter-spacing:1px;text-align:start;padding:10px 12px;font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
td.am,th.am{text-align:end;font-weight:600}
.tx{display:flex;gap:12px;align-items:center}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--okbg);color:var(--ok);flex:none}
.ic.e{background:var(--ex);color:#8a6a3b}.ic.u{background:var(--wnbg);color:var(--wn)}
.tx small,.mu{color:var(--mut);font-size:12px;display:block}
.pos{color:var(--ok)}.wn{color:var(--wn)}
.ar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ar:last-of-type{border:0}
.ar a,.rm{color:var(--ok);font-size:12px;text-decoration:none;font-weight:600;border:0;background:none;padding:0}
.tl{display:block;margin-top:10px;background:var(--inbg);border-radius:10px;padding:12px 14px;text-align:start;width:100%;border:0;display:flex;justify-content:space-between}
.bnav,.drawer{display:none}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme="dark"] .chip.on{color:#08120e}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--mint)}
.ov{position:fixed;inset:0;background:rgba(5,15,10,.55);display:none;place-items:center;z-index:20;padding:16px}
.ov.show{display:grid}
.mod{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;border:1px solid var(--bd)}
.mod input,.mod textarea,.f input{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px;font:inherit;margin:6px 0 12px}
.ir{display:flex;gap:8px}.ir input{margin:0}
.mic{border:0;background:var(--pri);color:#fff;border-radius:10px;width:46px}
:root[data-theme="dark"] .mic{color:#08120e}
.mic.on{background:#c9382f;color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
.cf{background:var(--okbg);border:1px dashed var(--ok);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;display:none}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;opacity:0;transition:.3s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.hide-t{display:table-cell}
@media (max-width:1100px){.app{--sw:76px}.app .lbl,.app .tagl,.app .biz>div,.app .sec,.app .help,.app .bd{display:none}.app .biz,.app .nv,.app .logo{justify-content:center}.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.me>div{display:none}#colb{display:none}.search{max-width:260px}}
@media (max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 14px;height:60px}.search,.crumb,.me{display:none}.top{justify-content:space-between}#colb{display:none}.content{padding:18px 16px 110px}h1{font-size:24px}.kpi .v{font-size:26px}.kpis{gap:12px}.card{padding:16px}.acts{width:100%}.acts .btn{flex:1;justify-content:center}.hide-m{display:none}.hl{gap:14px}.ring{width:100px;height:100px}.ring div{font-size:28px}
.bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;color:var(--mut);font-size:12px}
.bnav button.on{background:var(--okbg);color:var(--ok)}
.drawer{position:fixed;inset:0;background:var(--side);z-index:25;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow:auto;flex-direction:column;gap:6px}.drawer.show{display:flex}.drawer .lbl{display:inline}}
.brand{background:#fff;border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:center}
.brand .wm{height:32px;width:auto;max-width:100%}.brand .ic2{display:none;height:30px;width:30px}
.coll .brand .wm{display:none}.coll .brand .ic2{display:block}
.biz{width:100%;font:inherit;text-align:start;cursor:pointer;color:#fff}
.mlogo{display:none;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:5px 10px}.mlogo img{height:24px;display:block}
.fab{position:fixed;inset-inline-end:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:#6b3fd4;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(80,40,170,.4);z-index:8}
.fab svg{width:24px;height:24px}
.sw{display:flex;gap:12px;align-items:center;width:100%;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;margin-bottom:10px;text-align:start}
.sw.on{border-color:var(--ok);background:var(--okbg)}.sw small{display:block;color:var(--mut);font-size:12px}.sw>div{flex:1}
.stack{display:grid;gap:16px;max-width:680px}.stack h3{margin-bottom:12px}.stack .rowb h3{margin:0}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.drow small{color:var(--mut);display:block;max-width:340px}
.btn.d{color:#c9382f;border-color:#e8b8b4}
@media (max-width:1100px){.app .brand .wm{display:none}.app .brand .ic2{display:block}}
@media (max-width:700px){.mlogo{display:block}.fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline-end:16px}.top{gap:8px}}
</style>

function wnum(s){let tot=0,cur=0,run=false,half=0;for(const w of s.split(/[\s,.\-]+/)){

function saveE(){sync();const a=parseFloat(E.a);if(!(a>0)){setSt(t('nonum'),1);return}const x={id:Date.now()+'-'+Math.random(),k:E.k,a:Math.round(a),p:(E.p||'').trim()||(E.k==='sale'?'Counter':''),note:E.note,ts:Date.now()};if((x.k==='udhaar'||x.k==='payment')&&!x.p){setSt(t('party'),1);return}if(x.k==='sale')x.n=S.n++;S.tx.push(x);S.cleared=false;closeM();render();toast(t('saved'))}

/* ---- stores ---- */
const swb=id=>{const o=S.stores[id];return`<button class="sw ${id===S.sid?'on':''}" data-a="switch" data-id="${id}">${ic('store')}<div><b>${esc(o.store)}</b><small>${esc(o.owner)} · ${esc(o.city)}</small></div>${id===S.sid?'<b class="pos">✓</b>':''}</button>`};
function storesModal(){stash();E=null;show(`<div class="rowb"><h3>${t('switch')}</h3>${xb}</div><div style="margin:14px 0 4px">${Object.keys(S.stores).map(swb).join('')}</div><button class="btn p" data-a="addStore" style="width:100%;justify-content:center">${ic('plus')}${t('addstore')}</button>`)}
function addStoreModal(){E=null;show(`<div class="rowb"><h3>${t('addstore')}</h3>${xb}</div><label>${t('store')}<input id="nsn" placeholder="e.g. Noor General Store"></label><label>${t('owner')}<input id="nso"></label><label>${t('city')}<input id="nsc" value="${esc(S.city)}"></label><label style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" id="nsd" style="width:auto;margin:0"> ${t('sampleq')}</label><button class="btn p" data-a="mkStore" style="width:100%;justify-content:center">${t('create')}</button>`)}
function mkStore(){const n=$('#nsn').value.trim();if(!n){toast(t('store'));$('#nsn').focus();return}stash();const id='s'+Date.now();S.stores[id]={store:n,owner:$('#nso').value.trim()||S.owner,city:$('#nsc').value.trim()||S.city,tx:[],n:1,cleared:true};const sample=$('#nsd').checked;loadS(id);if(sample){S.cleared=false;seed()}S.view='dash';S.q='';$('#q').value='';closeM();render();toast(t('created'))}
function switchTo(id){if(id&&id!==S.sid&&S.stores[id]){stash();loadS(id);S.view='dash';S.q='';$('#q').value=''}closeM();render();toast(S.store)}
function saveStore(){const n=$('#stn').value.trim();if(!n){toast(t('store'));return}S.store=n;S.owner=$('#own').value.trim()||S.owner;S.city=$('#cty').value.trim()||S.city;stash();render();toast(t('savedst'))}
function delStore(){if(Object.keys(S.stores).length<2){toast(t('lastst'));return}ask(t('delstore')+': '+S.store,t('cfm3'),t('del'),()=>{delete S.stores[S.sid];loadS(Object.keys(S.stores)[0]);S.view='settings';render();toast(t('deleted'))})}
const resetS=()=>ask(t('reset'),t('cfm1'),t('yes'),()=>{S.cleared=false;seed();S.range='month';S.q='';$('#q').value='';render();toast(t('resetdone'))});
const clearS=()=>ask(t('clear'),t('cfm2'),t('yes'),()=>{S.tx=[];S.n=1;S.cleared=true;S.q='';$('#q').value='';render();toast(t('cleared'))});
function csv(){const r=[['Date','Type','Party','Amount','Note'],...[...S.tx].sort((a,b)=>b.ts-a.ts).map(x=>[new Date(x.ts).toISOString().slice(0,10),x.k,x.p,x.a,(x.note||'').replace(/"/g,'""')])];return r.map(l=>l.map(c=>`"${c}"`).join(',')).join('\n')}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b){if(ev.target.id==='ov')closeM();return}const a=b.dataset.a,d=b.dataset;
if(a==='go'){S.view=d.v;$('#drawer').classList.remove('show');render();scrollTo(0,0)}
else if(a==='col'){S.coll=!S.coll;render()}
else if(a==='drawer')$('#drawer').classList.toggle('show');
else if(a==='bell'){const n=open().filter(c=>dueTxt(c)[1]).length;toast(n?n+t('bell1'):t('bell0'))}
else if(a==='stores'){$('#drawer').classList.remove('show');storesModal()}
else if(a==='switch'){$('#drawer').classList.remove('show');switchTo(d.id)}
else if(a==='addStore')addStoreModal();
else if(a==='mkStore')mkStore();
else if(a==='saveStore')saveStore();
else if(a==='delStore')delStore();
else if(a==='resetS')resetS();
else if(a==='clearS')clearS();
else if(a==='yes'){const f=CF;closeM();if(f)f()}
else if(a==='new')entry(d.k,d.p);
else if(a==='voice')entry('sale','',true);
else if(a==='mic')mic();
else if(a==='vl'){sync();S.vl=d.v;save();if(REC){try{REC.abort()}catch(e){}REC=null}drawMod()}
else if(a==='close')closeM();
else if(a==='kind'){sync();E.k=d.k;drawMod()}
else if(a==='saveE')saveE();
else if(a==='lang'){S.lang=S.lang==='en'?'ur':'en';render()}
else if(a==='theme'){S.theme=(S.theme==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark';render()}
else if(a==='exp'){E=null;show(`<div class="rowb"><h3>${t('csv')}</h3>${xb}</div><textarea id="csvt" rows="10" readonly style="font:12px monospace">${esc(csv())}</textarea><button class="btn p" data-a="copy">${t('copy')}</button>`)}
else if(a==='copy'){const ta=$('#csvt');ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?t('copied'):'Ctrl+C')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if((e.key==='Enter'||e.key===' ')&&e.target.id==='me'){e.preventDefault();storesModal()}});
document.addEventListener('change',ev=>{if(ev.target.dataset.a==='range'){S.range=ev.target.value;render()}});
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(!['dash','sales','expenses','customers','suppliers'].includes(S.view))S.view='sales';$('#view').innerHTML=V[S.view]()});
addEventListener('resize',()=>{$('#burger').style.display=matchMedia('(max-width:700px)').matches?'grid':'none'});
render();
</script>
</body>
</html>
